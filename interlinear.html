<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interlinear — 개발자와 실무자 사이</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --paper-2:#F7F7F7;
  --ink:#0A0A0A;
  --ink-2:#454545;
  --gray:#8A8A8A;
  --gray-2:#B4B4B4;
  --line:#E2E2E2;
  --line-2:#CFCFCF;

  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --pad:28px;
  --max:1240px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.mono{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--ink);
  padding:0 var(--pad);
  position:sticky;top:0;z-index:20;
  background:var(--paper);
}
.masthead-in{
  max-width:var(--max);margin:0 auto;
  display:flex;align-items:baseline;gap:22px;
  height:60px;
}
.wordmark{
  font-weight:800;font-size:19px;letter-spacing:-.045em;
}
.wordmark span{font-weight:200;color:var(--gray)}
.tagline{color:var(--gray);font-size:13px;letter-spacing:-.01em}
.masthead-end{margin-left:auto;display:flex;gap:20px;align-items:baseline}
.masthead-end a{color:var(--gray);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.masthead-end a:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- search hero ---------- */
.hero{
  border-bottom:1px solid var(--line);
  background:var(--paper-2);
  padding:0 var(--pad);
}
.hero-in{
  max-width:var(--max);margin:0 auto;
  padding:44px 0 40px;
}
.hero-lede{
  color:var(--gray);font-size:13.5px;letter-spacing:-.01em;
  margin-bottom:14px;
}
.searchbox{
  position:relative;max-width:660px;
}
.searchbox svg{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:var(--gray);fill:none;stroke-width:2;
  pointer-events:none;
}
.search{
  width:100%;
  border:none;border-bottom:2px solid var(--ink);
  background:none;color:var(--ink);
  font-family:var(--sans);font-weight:600;letter-spacing:-.025em;
  font-size:26px;line-height:1.3;
  padding:6px 40px 12px 32px;
  caret-color:var(--ink);
}
.search::placeholder{color:var(--gray-2);font-weight:300}
.search:focus{outline:none}
.search-clear{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  color:var(--gray);font-size:13px;padding:6px;
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.search-clear.show{opacity:1;pointer-events:auto}
.search-clear:hover{color:var(--ink)}

.hero-hints{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:baseline;
}
.hint-label{color:var(--gray-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;margin-right:4px}
.hint{
  font-family:var(--mono);font-size:11px;letter-spacing:.02em;
  color:var(--ink-2);border:1px solid var(--line-2);
  padding:4px 10px;background:var(--paper);
  transition:border-color .15s,color .15s;
}
.hint:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- grid ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.grid-h{
  display:flex;align-items:baseline;gap:16px;
  padding:30px 0 14px;
}
.count{color:var(--gray)}
.sort{margin-left:auto;color:var(--gray);display:flex;gap:14px}
.sort button{font-size:12.5px;letter-spacing:-.01em}
.sort button[aria-pressed="true"]{color:var(--ink);font-weight:600}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:0;
  border-top:1px solid var(--ink);
  border-left:1px solid var(--line);
  margin-bottom:96px;
}
.card{
  display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:26px 24px 22px;
  min-height:230px;
  background:var(--paper);
  transition:background .16s;
  animation:fade .32s ease;
}
.card:hover{background:var(--paper-2)}

.card-top{
  display:flex;align-items:baseline;gap:10px;
  margin-bottom:14px;
}
.card-date{font-family:var(--mono);font-size:10.5px;color:var(--gray);letter-spacing:.03em}
.card-min{font-family:var(--mono);font-size:10.5px;color:var(--gray-2);letter-spacing:.03em;margin-left:auto}

.card-t{
  font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1.42;
}
.card-t span{
  display:inline;background-image:linear-gradient(var(--ink),var(--ink));
  background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;
  transition:background-size .3s cubic-bezier(.4,0,.15,1);
}
.card:hover .card-t span{background-size:100% 1px}

.card-d{
  color:var(--ink-2);font-size:13.5px;letter-spacing:-.012em;
  margin-top:9px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-tags{
  display:flex;gap:6px;flex-wrap:wrap;
  margin-top:auto;padding-top:18px;
}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.03em;
  color:var(--gray);border:1px solid var(--line-2);
  padding:2px 7px;background:var(--paper);
  transition:border-color .15s,color .15s;
}
.tag:hover{border-color:var(--ink);color:var(--ink)}

mark{
  background:var(--ink);color:var(--paper);
  padding:0 2px;
}

@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.empty{
  grid-column:1/-1;
  padding:80px 24px;color:var(--gray);text-align:center;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}

.foot{
  border-top:1px solid var(--ink);padding:22px var(--pad) 60px;
}
.foot-in{
  max-width:var(--max);margin:0 auto;display:flex;gap:18px;
  color:var(--gray);flex-wrap:wrap;
}

@media (max-width:640px){
  :root{--pad:20px}
  .hero-in{padding:32px 0 30px}
  .search{font-size:20px;padding-left:28px}
  .searchbox svg{width:17px;height:17px}
  .tagline{display:none}
  .masthead-in{gap:12px}
  .card{min-height:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <a href="#" class="wordmark">inter<span>linear</span></a>
    <span class="tagline">개발자와 실무자 사이</span>
    <nav class="masthead-end mono">
      <a href="#">노트</a>
      <a href="#">스터디</a>
      <a href="#">소개</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-in">
    <p class="hero-lede">개발자와 실무자 사이, 서로 못 알아듣는 영역을 번역합니다.</p>
    <div class="searchbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search" id="q" type="search" placeholder="무엇을 찾으세요?" aria-label="노트 검색" autocomplete="off">
      <button class="search-clear" id="clear" aria-label="검색어 지우기">지우기 ✕</button>
    </div>
    <div class="hero-hints" id="hints">
      <span class="hint-label">바로가기</span>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="grid-h">
    <h1 class="mono">노트</h1>
    <span class="count mono" id="count"></span>
    <div class="sort">
      <button id="sNew" aria-pressed="true">최신순</button>
      <button id="sName" aria-pressed="false">가나다순</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <div class="foot-in mono">
    <span>interlinear.dev</span>
    <span>—</span>
    <span>Lissa</span>
    <span style="margin-left:auto">RSS</span>
  </div>
</footer>

<script>
const POSTS = [
  { date:"2026-08-02", min:12, tags:["fabric-iq","ontology"],
    t:"Ontology 바인딩과 스키마 드리프트 방어",
    d:"엔티티 타입을 OneLake 테이블에 바인딩할 때 컬럼 리네임이 발생하면 어디서 터지고, 무엇이 조용히 통과하는지 실제로 깨뜨려 보며 확인했다." },
  { date:"2026-07-28", min:9, tags:["data-agent","evaluation"],
    t:"Data Agent 한국어 질의 품질 측정 세트 만들기",
    d:"모호한 지시어, 조사 생략, 축약형이 섞인 한국어 질의 40건으로 평가셋을 구성하고 실패 유형을 분류했다." },
  { date:"2026-07-21", min:7, tags:["ax","공공"],
    t:"'AI로 뭘 할지 모르겠다'에서 시작하는 법",
    d:"기관 워크숍에서 반복해서 통했던 질문 순서. 아이디어를 모으는 게 아니라 걸러내는 과정에 가깝다." },
  { date:"2026-07-14", min:15, tags:["power-bi","semantic-model"],
    t:"시맨틱 모델을 온톨로지로 승격시킬 때 남는 것과 버리는 것",
    d:"기존 Power BI 모델에서 관계·측정값이 어떻게 매핑되고, 무엇이 수작업으로 남는지 실제 모델로 검증했다." },
  { date:"2026-07-05", min:11, tags:["d365","migration"],
    t:"외화 재평가 로직이 어긋날 때의 대사 전략",
    d:"금액 일치가 아니라 차이의 전량 설명을 목표로 바꾸면 검증 구조가 어떻게 달라지는지. ERP 이관 검증 실무 기록." },
  { date:"2026-06-26", min:6, tags:["copilot-studio","governance"],
    t:"에이전트 배포 전에 확인할 데이터 경계 질문 6개",
    d:"커넥터 조합이 만들어내는 데이터 이동 경로를 배포 전에 확인하는 법. IT팀에게 물어야 할 것과 곤란한 답변의 신호까지." },
  { date:"2026-06-18", min:8, tags:["fabric-iq","mcp"],
    t:"Ontology를 MCP 서버로 노출해 외부 에이전트에 연결하기",
    d:"mcp.json 설정부터 실제 질의까지, 붙는 것과 안 붙는 것을 구분해서. 사내 데이터를 다른 AI 도구가 이해하게 만드는 구조." },
  { date:"2026-06-09", min:10, tags:["ab-100","architecture"],
    t:"AB-100 준비 과정에서 정리한 아키텍처 판단 기준",
    d:"시험 문제를 푸는 기준이 아니라 실제 설계에서 쓰이는 판단 축으로 재구성했다. Copilot, 에이전트, 직접 개발 사이의 선택 순서." },
  { date:"2026-05-30", min:13, tags:["fabric","workshop"],
    t:"Fabric 스터디 시즌1 운영 회고",
    d:"Learn 모듈 기반 시즌제 스터디를 8주간 돌리며 배운 것. 완주율을 가른 건 콘텐츠가 아니라 진도 설계였다." },
];

const HINT_TAGS = ["fabric-iq","data-agent","ontology","copilot-studio","ax"];

let query = "", sort = "new";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (s, q) => {
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+q.length)) + "</mark>" + esc(s.slice(i+q.length));
};

function render(){
  let out = POSTS.filter(p => {
    if (!query) return true;
    const hay = (p.t + " " + p.d + " " + p.tags.join(" ")).toLowerCase();
    return hay.includes(query.toLowerCase());
  });

  out.sort((a,b) => sort === "new"
    ? b.date.localeCompare(a.date)
    : a.t.localeCompare(b.t, "ko"));

  document.getElementById("count").textContent = `${out.length}편`;

  document.getElementById("grid").innerHTML = out.length ? out.map(p => `
    <article class="card">
      <div class="card-top">
        <span class="card-date">${p.date.slice(2).replace(/-/g,".")}</span>
        <span class="card-min">${p.min} min</span>
      </div>
      <a href="#"><h3 class="card-t"><span>${hl(p.t, query)}</span></h3></a>
      <p class="card-d">${hl(p.d, query)}</p>
      <div class="card-tags">${p.tags.map(t=>`<button class="tag" data-tag="${t}">${t}</button>`).join("")}</div>
    </article>`).join("")
  : `<div class="empty"><b>"${esc(query)}"에 맞는 노트가 없습니다.</b>다른 단어로 검색해 보세요.</div>`;
}

const q = document.getElementById("q");
const clearBtn = document.getElementById("clear");

function setQuery(v, focus){
  query = v.trim();
  q.value = v;
  clearBtn.classList.toggle("show", !!query);
  if (focus) q.focus();
  render();
}

q.addEventListener("input", e => setQuery(e.target.value, false));
clearBtn.onclick = () => setQuery("", true);

// tag chips inside cards -> fill search
document.getElementById("grid").addEventListener("click", e => {
  const t = e.target.closest(".tag");
  if (t) { e.preventDefault(); setQuery(t.dataset.tag, false); window.scrollTo({top:0, behavior:"smooth"}); }
});

// quick hints under search
const hints = document.getElementById("hints");
HINT_TAGS.forEach(t => {
  const b = document.createElement("button");
  b.className = "hint"; b.textContent = t;
  b.onclick = () => setQuery(t, false);
  hints.appendChild(b);
});

// keyboard: "/" focuses search
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) setQuery("", false);
});

document.getElementById("sNew").onclick = () => setSort("new");
document.getElementById("sName").onclick = () => setSort("name");
function setSort(s){
  sort = s;
  document.getElementById("sNew").setAttribute("aria-pressed", s === "new");
  document.getElementById("sName").setAttribute("aria-pressed", s === "name");
  render();
}

render();
</script>
</body>
</html>
